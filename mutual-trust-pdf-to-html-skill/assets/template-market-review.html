<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title><!-- PAGE_TITLE --></title>
    <meta name="description" content="<!-- META_DESCRIPTION -->" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="<!-- CANONICAL_URL -->" />

    <meta property="og:title" content="<!-- OG_TITLE -->" />
    <meta property="og:description" content="<!-- OG_DESCRIPTION -->" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="<!-- OG_URL -->" />
    <meta property="og:image" content="<!-- OG_IMAGE -->" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<!-- TWITTER_TITLE -->" />
    <meta name="twitter:description" content="<!-- TWITTER_DESCRIPTION -->" />
    <meta name="twitter:image" content="<!-- TWITTER_IMAGE -->" />

    <link
      rel="icon"
      href="https://www.mutualtrust.com.au/wp-content/uploads/2024/10/favicon.png"
      type="image/png"
    />

    <style>
      /* ==========================================================================
       Market Review family template (Group A) — continuous responsive web
       Framework: Mutual-Trust-Design-Analysis-Framework.md (B.7 A + B.5 + B.9 + C.6)

       Patterns vs Perspective (Group C):
       - Hero: title + date OVERLAY on image; typically NO logo on hero (logo in dark footer)
       - Dense body + bullet lists (Flush default; Outdent on some QMR — B.9)
       - Heat data table (--color-positive / --color-negative) — framework B.6.2–B.6.3
         Desktop: full columns like PDF; Mobile: .mr-table-wrap overflow-x (no page scroll)
       - Chart grid 2×3 — framework B.7.1; one image per panel (never 6-in-1 composite); stack mobile
       - Dark footer band: contacts + multi-para disclaimer (not white legal only)

       CONVERT WORKFLOW (C.6 / B.7.1 / B.7.3):
       1. Inspect PDF: page W, content x0, hero title y0, hero H, table, charts, footer, block gaps
       2. Override --page-max, --mr-page-w-pt, --mr-content-x-pt, --mr-hero-title-y-pt, --mr-*-gap*
       3. Hero overlay: title left = body left; pad-top from title y (not 5vw gutter)
       4. Spacing: para/h2/list/table/chart/CTA from PDF (B.7.3) — not Perspective --space-5/6
       5. Mobile ≤768: content side gutters = Perspective (--gutter: 20px on .container)
       6. Fill continuous article; Visual Comparison Loop — desktop then mobile
       ========================================================================== */

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville.woff2') format('woff2'),
          url('assets/fonts/Baskerville.woff') format('woff'),
          url('assets/fonts/Baskerville.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville-Italic.woff2') format('woff2'),
          url('assets/fonts/Baskerville-Italic.woff') format('woff'),
          url('assets/fonts/Baskerville-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Regular.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Regular.woff') format('woff'),
          url('assets/fonts/ProximaNova-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-RegularIt.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-RegularIt.woff') format('woff'),
          url('assets/fonts/ProximaNova-RegularIt.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Medium.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Medium.woff') format('woff'),
          url('assets/fonts/ProximaNova-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Semibold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Semibold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Bold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Bold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Black.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Black.woff') format('woff'),
          url('assets/fonts/ProximaNova-Black.ttf') format('truetype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        /* Style Guide tokens */
        --font-serif: 'Baskerville', Georgia, 'Times New Roman', serif;
        --font-sans: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;

        --color-black: #000000;
        --color-white: #ffffff;
        --color-light-grey: #f4f4f4;
        --color-grey: #767676;
        --color-ochre: #cb962e;

        --color-ink: var(--color-black);
        --color-ink-muted: var(--color-grey);
        --color-accent: var(--color-ochre);
        --color-link: var(
          --color-ochre
        ); /* override per PDF if intentional (e.g. #D17B19) */
        --color-surface: var(--color-white);
        --color-surface-tint: var(--color-light-grey);
        --color-surface-dark: var(--color-black);

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;
        --space-6: 48px;
        --space-7: 64px;

        /* Page shell = PDF page width @ 96dpi (A4 595.32pt → ~794px). Override per PDF. */
        --page-max: 793.76px;
        /* Content column = shell; inset from measured PDF x (B.7.2) — not 5vw */
        --container-max: var(--page-max);
        --gutter: 20px; /* mobile = Perspective (B.7.1); desktop uses --mr-content-x-* */

        --text-h1: 70px;
        --text-h1-lh: 72px;
        --text-h2: 48px;
        --text-h2-lh: 1.2;
        --text-h3: 40px;
        --text-h3-lh: 1.1;
        --text-h4: 32px;
        --text-h4-lh: 1.3;
        --text-h5: 24px;
        --text-h5-lh: 1.4;
        --text-h6: 16px;
        --text-h6-lh: 1.4;

        --text-large: 20px;
        --text-large-lh: 1.5;
        --text-medium: 18px;
        --text-medium-lh: 24px;
        --text-regular: 16px;
        --text-regular-lh: 1.5;
        --text-small: 14px;
        --text-small-lh: 1.5;

        --focus-ring: 2px solid var(--color-ochre);
        --focus-offset: 3px;

        /* Shared list tokens (framework B.9) */
        --list-marker-color: var(--color-ink);
        --list-marker-gap: 24px;
        --list-indent: var(--list-marker-gap);
        --list-marker-size: 5px;
        --list-item-gap: var(--mr-list-item-gap, 8px);

        /* Market Review semantic (B.6) — heat table cells */
        --color-positive: #00675a;
        --color-negative: #822333;

        /* ------------------------------------------------------------------
         Market Review tokens — OVERRIDE PER PDF (C.6 / B.7.2)
         Measure page W, content x0, hero title y0, hero band H in PDF pt.
         Example defaults ≈ April 2026 MMR — replace per file.
         ------------------------------------------------------------------ */
        --mr-page-w-pt: 594.96; /* PDF page width (pt) */
        --mr-content-x-pt: 85.08; /* body + hero title left edge (pt) — same column */
        /* Right margin often tighter than left (April ≈ 55pt vs 85pt) — measure PDF x1 */
        --mr-content-x-right-pt: 55.28;
        --mr-hero-title-y-pt: 55.28; /* title top y from page/hero top (pt) */
        --mr-hero-aspect: 594.96 / 183.78; /* PDF band W/H — desktop */
        --mr-hero-aspect-mobile: 3 / 2;
        --mr-hero-position: center center;
        --mr-hero-position-mobile: var(--mr-hero-position);
        --mr-hero-scrim: rgba(
          27,
          27,
          32,
          0.65
        ); /* override / none if PDF needs no scrim */
        /* Desktop pad-top derived from pt (see .mr-hero__inner); mobile may override */
        --mr-hero-pad-top: 28px;
        --mr-title-size: 52px; /* 39pt → px @ 96dpi */
        --mr-title-lh: 1.3; /* match PDF title bbox / size */
        --mr-title-color: var(--color-white);
        --mr-date-size: 34px; /* ~26pt; use mixed spans if PDF has two sizes */
        --mr-date-lh: 1.15;
        --mr-date-tracking: 0.04em;
        --mr-date-gap: 0px; /* PDF title→date often ~0–4pt */
        --mr-date-color: var(--color-white);
        /* Spacing rhythm — measure PDF pt × 4/3; override per file (B.7.3) */
        --mr-band-gap: 19px; /* hero→body; April ≈ 14.4pt */
        --mr-body-size: 13.33px; /* 10pt */
        --mr-body-lh: 1.28; /* PDF leading ~12.2/10; slight web open */
        --mr-para-gap: 9px; /* ~6.5pt between body paragraphs */
        --mr-section-gap-before: 10px; /* ~5–6pt body/list → h2 */
        --mr-section-gap-after: 6px; /* ~3–4pt h2 → list/body */
        --mr-list-item-gap: 8px; /* ~6pt between bullet items */
        --mr-list-block-gap: 10px; /* after ul before next block */
        --mr-table-block-gap: 12px; /* before/after heat table */
        --mr-chart-block-gap-before: 28px; /* table/source → chart grid */
        --mr-chart-block-gap-after: 24px; /* charts → CTA; April ≈ 18pt */
        --mr-chart-gap: 12px; /* panel grid; PDF row ~6pt, col wider */
        --mr-chart-gap-col: 24px;
        --mr-cta-gap-before: 0px; /* included in chart-block-gap-after */
        --mr-cta-gap-after: 20px; /* CTA→note clearspace; measure PDF */
        --mr-note-gap-after: 24px; /* note→footer */
        --mr-note-pad-y: 16px;
        --mr-note-pad-x: 14px;
        --mr-note-bg: #eaedf1; /* measure PDF fill; April ≈ rgb(234,237,241) */
        --mr-article-pad-bottom: 0px;
        --mr-section-size: 21px; /* ~16pt Baskerville */
        --mr-section-color: var(--color-ink);
        --mr-table-title-color: var(--color-ochre);
        --mr-table-title-size: 16px;
        --mr-table-cell-size: 12px;
        --mr-caption-size: 11px;
        --mr-footer-bg: var(--color-black);
        --mr-footer-fg: var(--color-white);
        /* Dark MMR footer: legal usually full white like contacts (April 2026) */
        --mr-footer-muted: var(--color-white);
        --mr-legal-size: 8px; /* PDF ~6pt — bump slightly for web */
        --mr-legal-lh: 1.35;
        --mr-contact-label-color: var(--color-white);
        --mr-contact-label-size: 12px; /* ~9pt Baskerville city labels */
        --mr-logo-width: 160px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        margin: 0;
        min-width: 0;
        font-family: var(--font-sans);
        font-size: var(--text-regular);
        font-weight: 400;
        line-height: var(--text-regular-lh);
        color: var(--color-ink);
        background-color: var(--color-surface);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      img,
      picture,
      video,
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      a {
        color: var(--color-link);
        text-decoration: none; /* PDF often colour-only; do not invent underline */
        font-weight: inherit; /* match PDF; do not invent bold links */
      }

      a:hover {
        text-decoration: underline; /* web affordance only */
        text-underline-offset: 0.15em;
      }

      a:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      :focus:not(:focus-visible) {
        outline: none;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        color: var(--color-ink);
      }

      p {
        margin: 0 0 var(--mr-para-gap);
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
      }

      strong,
      b {
        font-weight: 700;
      }

      em,
      i {
        font-style: italic;
      }

      .text-muted {
        color: var(--color-ink-muted);
      }

      .text-small {
        font-size: var(--text-small);
        line-height: var(--text-small-lh);
      }

      .skip-link {
        position: absolute;
        left: var(--space-3);
        top: 0;
        z-index: 1000;
        padding: var(--space-2) var(--space-3);
        background: var(--color-black);
        color: var(--color-white);
        font-family: var(--font-sans);
        font-size: var(--text-small);
        text-decoration: none;
        transform: translateY(-120%);
      }

      .skip-link:focus {
        transform: translateY(var(--space-3));
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Continuous document shell = PDF page width (not full viewport, not multi-page A4) */
      .document {
        width: 100%;
        max-width: var(--page-max);
        margin-inline: auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-surface);
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        /* % padding → shell width. Left/right often asymmetric in PDF (B.7.1). */
        padding-left: max(
          var(--gutter),
          calc(100% * var(--mr-content-x-pt) / var(--mr-page-w-pt))
        );
        padding-right: max(
          var(--gutter),
          calc(
            100% * var(--mr-content-x-right-pt, var(--mr-content-x-pt)) /
              var(--mr-page-w-pt)
          )
        );
      }

      .site-main {
        flex: 1 0 auto;
        width: 100%;
      }

      /* Never rely on browser default list styling (C.6.6 / B.9) */
      .mr-body ul,
      .mr-body ol {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--mr-list-block-gap);
      }

      /* Shared list — framework B.9 (Flush default; add --outdent / --inset per PDF) */
      ul.mt-list,
      ol.mt-list {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--mr-list-block-gap);
      }

      ul.mt-list > li,
      ol.mt-list > li {
        position: relative;
        padding-left: var(--list-indent);
        text-indent: 0;
        line-height: var(--mr-body-lh);
        margin: 0 0 var(--list-item-gap);
        color: var(--color-ink);
      }

      ul.mt-list > li:last-child,
      ol.mt-list > li:last-child {
        margin-bottom: 0;
      }

      /* Small disc ≈ SymbolMT — not full-size • (too large vs PDF) */
      ul.mt-list > li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.55em;
        width: var(--list-marker-size);
        height: var(--list-marker-size);
        border-radius: 50%;
        background-color: var(--list-marker-color);
      }

      ol.mt-list {
        counter-reset: mt-counter;
      }

      ol.mt-list > li::before {
        counter-increment: mt-counter;
        content: counter(mt-counter) '.';
        position: absolute;
        left: 0;
        width: var(--list-indent);
        color: var(--list-marker-color);
        font-size: inherit;
        line-height: inherit;
        background: none;
        border-radius: 0;
      }

      .mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }

      .mt-list--inset {
        padding-left: var(--list-indent);
      }

      .mr-body ul.mt-list--inset {
        padding-left: var(--list-indent);
      }

      .mr-body ul.mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }

      /* ==========================================================================
       MARKET REVIEW FAMILY — Group A layout patterns (B.7)
       ========================================================================== */

      /* --- Hero: title overlay, typically no logo (B.7 A) --- */
      .mr-hero {
        position: relative;
        width: 100%;
        aspect-ratio: var(--mr-hero-aspect);
        height: auto;
        min-height: 0;
        overflow: hidden;
        flex-shrink: 0;
        color: var(--color-white);
        background-color: #2a2a2a;
        background-image: var(--mr-hero-image, none);
        background-position: var(--mr-hero-position);
        background-size: cover;
        background-repeat: no-repeat;
      }

      .mr-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--mr-hero-scrim);
        pointer-events: none;
      }

      .mr-hero__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        /* Title y (pt) / page W (pt) × hero width — matches PDF vertical placement (B.7.2) */
        padding-top: max(
          16px,
          calc(100% * var(--mr-hero-title-y-pt) / var(--mr-page-w-pt))
        );
        padding-bottom: var(--space-3);
        box-sizing: border-box;
      }

      .mr-hero__title {
        margin: 0;
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-title-size);
        line-height: var(--mr-title-lh);
        color: var(--mr-title-color);
        max-width: none; /* many MMR titles are single-line; override if PDF wraps */
      }

      .mr-hero__date {
        margin: var(--mr-date-gap) 0 0;
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-date-size);
        line-height: var(--mr-date-lh);
        letter-spacing: var(--mr-date-tracking);
        text-transform: uppercase;
        color: var(--mr-date-color);
      }

      /* Optional mixed date sizes (e.g. APRIL 21pt + 2026 26pt) */
      .mr-hero__date .mr-hero__month {
        font-size: calc(var(--mr-date-size) * 0.81);
        letter-spacing: var(--mr-date-tracking);
      }

      .mr-hero__date .mr-hero__year {
        font-size: var(--mr-date-size);
      }

      /* Optional logo on hero — rare for Group A; hide by default */
      .mr-hero__logo {
        display: none;
        margin-bottom: var(--space-3);
        line-height: 0;
      }

      .mr-hero--with-logo .mr-hero__logo {
        display: inline-block;
      }

      .mr-hero__logo img {
        width: var(--mr-logo-width);
        height: auto;
        display: block;
      }

      /* --- Article --- */
      .mr-article {
        padding-top: var(--mr-band-gap);
        padding-bottom: var(--mr-article-pad-bottom);
      }

      .mr-body {
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
        color: var(--color-ink);
      }

      .mr-body > p {
        margin: 0 0 var(--mr-para-gap);
        font-size: inherit;
        line-height: inherit;
      }

      .mr-body h2,
      .mr-body .mr-section-title {
        margin: var(--mr-section-gap-before) 0 var(--mr-section-gap-after);
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-section-size);
        line-height: 1.25;
        color: var(--mr-section-color);
      }

      .mr-body h2:first-child,
      .mr-body .mr-section-title:first-child {
        margin-top: 0;
      }

      .mr-body ul.mt-list {
        margin: 0 0 var(--mr-list-block-gap);
      }

      /* --- Heat / Global Markets table (B.6.2) — full black grid; heat fills cell --- */
      .mr-table-block {
        margin: var(--mr-table-block-gap) 0;
      }

      .mr-table-block__title {
        margin: 0 0 8px;
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: var(--mr-table-title-size);
        color: var(--mr-table-title-color);
      }

      .mr-table-wrap {
        width: 100%;
        overflow-x: visible; /* desktop: table fits content column (no sideways scroll) */
        -webkit-overflow-scrolling: touch;
      }

      .mr-table {
        width: 100%;
        min-width: 0; /* desktop: match PDF table ≈ body width; mobile sets min-width below */
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        font-family: var(--font-sans);
        font-size: var(--mr-table-cell-size);
        line-height: 1.25;
        background: var(--color-white);
      }

      .mr-table col.mr-table__col-label {
        width: 38%;
      }

      .mr-table col.mr-table__col-num {
        width: 10.333%;
      }

      .mr-table th,
      .mr-table td {
        padding: 2px 4px;
        text-align: center;
        vertical-align: middle;
        border: 1px solid #000000; /* PDF grid — abut cells, no white gutters */
        background: var(--color-white);
        color: var(--color-ink);
        box-sizing: border-box;
      }

      .mr-table th:first-child,
      .mr-table td:first-child {
        text-align: left;
        font-weight: 400;
        padding-left: 6px;
        white-space: nowrap;
      }

      .mr-table thead th {
        font-weight: 400;
        font-size: 11px;
        color: var(--color-ink);
        padding: 4px 3px;
      }

      .mr-table thead th.mr-table__group {
        color: var(--mr-table-title-color);
        text-align: left;
        font-size: 12px;
      }

      /* Heat: background on <td> fills to border edge */
      .mr-table .is-positive {
        background: var(--color-positive);
        color: var(--color-white);
        text-align: center;
      }

      .mr-table .is-negative {
        background: var(--color-negative);
        color: var(--color-white);
        text-align: center;
      }

      .mr-table .is-neutral {
        background: var(--color-white);
        color: var(--color-ink);
        text-align: center;
      }

      .mr-table tr.mr-table__section td {
        background: var(--color-white);
        color: var(--mr-table-title-color);
        font-weight: 400;
        text-align: left;
        padding: 4px 6px;
        border: 1px solid #000000;
      }

      .mr-table-block__source {
        margin: 6px 0 0;
        font-size: var(--mr-caption-size);
        line-height: 1.35;
        color: var(--color-ink);
        font-style: italic; /* when PDF Source is italic */
      }

      /* --- Chart grid 2×3 (B.7 A) — split panels; stack on mobile --- */
      .mr-chart-grid {
        margin: var(--mr-chart-block-gap-before) 0
          var(--mr-chart-block-gap-after);
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--mr-chart-gap);
      }

      @media (min-width: 700px) {
        .mr-chart-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: var(--mr-chart-gap-col, var(--mr-chart-gap));
          row-gap: var(--mr-chart-gap);
        }
      }

      .mr-chart {
        margin: 0;
      }

      .mr-chart img {
        width: 100%;
        height: auto;
        display: block;
      }

      .mr-chart figcaption,
      .mr-chart .source {
        margin: 6px 0 0;
        font-family: var(--font-sans);
        font-size: var(--mr-caption-size);
        line-height: 1.35;
        color: var(--color-ink-muted);
      }

      /* --- CTA under charts (beat .mr-body > p margin) --- */
      .mr-body > p.mr-cta,
      .mr-cta {
        margin: var(--mr-cta-gap-before) 0 var(--mr-cta-gap-after);
        text-align: left; /* PDF usually full-measure, not centered */
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
      }

      /* When PDF has ochre hairline under link (April "click here") — underline base */
      .mr-cta a {
        color: var(--color-link);
        text-decoration: underline;
        text-decoration-color: var(--color-link);
        text-decoration-thickness: 1px;
        /* ~2px under glyphs — matches PDF clearspace; avoid 0 (cuts text) and ~0.12em (too airy) */
        text-underline-offset: 2px;
        text-decoration-skip-ink: none;
        font-weight: 400; /* match PDF unless source is bold */
      }

      .mr-cta a:hover,
      .mr-cta a:focus-visible {
        text-decoration-thickness: 1.5px;
      }

      /* Optional note callout (e.g. quarterly cadence) — match PDF fill */
      .mr-body > p.mr-note,
      .mr-note {
        margin: 0 0 var(--mr-note-gap-after);
        padding: var(--mr-note-pad-y, 14px) var(--mr-note-pad-x, 12px);
        background: var(--mr-note-bg, #eaedf1);
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
        color: var(--color-ink);
      }

      .mr-note strong {
        font-weight: 700;
      }

      /* --- Contacts grid (B.5) — reused in dark footer --- */
      .perspective-contacts {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3) var(--space-4);
        align-items: start;
      }

      @media (min-width: 600px) {
        .perspective-contacts {
          grid-template-columns:
            minmax(0, 1.15fr) minmax(0, 0.85fr) minmax(0, 0.85fr)
            minmax(0, 1.2fr);
          gap: var(--space-3) var(--space-5);
        }

        .perspective-contacts__meta {
          grid-column: auto;
        }
      }

      .perspective-contacts__office,
      .perspective-contacts__stack,
      .perspective-contacts__col {
        margin: 0;
        font-size: inherit;
        line-height: inherit;
      }

      .perspective-contacts__stack + .perspective-contacts__stack {
        margin-top: var(--space-3);
      }

      .perspective-contacts__office strong,
      .perspective-contacts__stack strong {
        display: block;
        margin-bottom: var(--space-1);
      }

      .perspective-contacts__meta {
        margin: 0;
      }

      .perspective-contacts__meta p {
        margin: 0;
      }

      /* --- Dark footer band (B.7 A / B.5 on dark) --- */
      .mr-footer {
        margin-top: auto;
        background: var(--mr-footer-bg);
        color: var(--mr-footer-fg);
        padding: var(--space-4) 0 var(--space-5);
      }

      .mr-footer a {
        color: var(--mr-footer-fg);
        text-decoration: none;
        font-family: var(--font-sans);
        font-weight: 400;
      }

      .mr-footer__logo {
        display: inline-block;
        margin: 0 0 var(--space-5);
        line-height: 0;
      }

      .mr-footer__logo img {
        width: var(--mr-logo-width);
        height: auto;
        display: block;
      }

      /* Reuse B.5 contact structure; colours for dark band */
      .mr-footer .perspective-contacts {
        margin: 0 0 var(--space-5);
        color: var(--mr-footer-fg);
        font-family: var(--font-sans);
        font-size: var(--mr-legal-size);
        line-height: var(--mr-legal-lh);
        font-weight: 400;
      }

      /* City labels: Baskerville regular (PDF), not bold sans */
      .mr-footer .perspective-contacts__office strong,
      .mr-footer .perspective-contacts__stack strong {
        color: var(--mr-contact-label-color);
        font-size: var(--mr-contact-label-size);
        font-family: var(--font-serif);
        font-weight: 400;
      }

      .mr-footer .perspective-contacts__meta {
        color: var(--mr-footer-fg);
        font-family: var(--font-sans);
        font-size: var(--mr-legal-size);
        line-height: var(--mr-legal-lh);
      }

      .mr-footer .perspective-contacts p {
        margin: 0;
        font-size: inherit; /* beat global `p { font-size: body }` */
        line-height: inherit;
        font-family: inherit;
        font-weight: 400;
      }

      /* Gap before ABN line (PDF ~14pt under www) */
      .mr-footer .perspective-contacts__meta p:last-child {
        margin-top: 12px;
      }

      /* tel: / office links — no underline (PDF has none) */
      .mr-footer .perspective-contacts a {
        color: var(--mr-footer-fg);
        text-decoration: none;
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: inherit;
      }

      /*
        Meta email + www: PDF draws white hairline underlines (April MMR).
        Do NOT leave these as decoration-none — mismatch vs source.
      */
      .mr-footer .perspective-contacts__meta a {
        color: var(--mr-footer-fg);
        text-decoration: underline;
        text-decoration-color: var(--mr-footer-fg);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.18em;
        font-family: var(--font-sans);
        font-weight: 400;
      }

      .mr-footer .perspective-contacts a:hover {
        text-decoration: underline;
        text-decoration-color: var(--mr-footer-fg);
        text-underline-offset: 0.18em;
      }

      .mr-footer .mr-legal {
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--mr-legal-size);
        line-height: var(--mr-legal-lh);
        font-weight: 400;
        color: var(--mr-footer-muted);
      }

      .mr-footer .mr-legal > p {
        margin: 0 0 var(--space-3);
        font-size: inherit;
        line-height: inherit;
        color: inherit;
      }

      .mr-footer .mr-legal > p:last-child {
        margin-bottom: 0;
      }

      .mr-footer .perspective-contacts + .mr-legal > p:first-child,
      .mr-footer .perspective-contacts + p {
        margin-top: 0;
      }

      /* Mobile / tablet */
      @media (max-width: 768px) {
        :root {
          --mr-title-size: 32px;
          --mr-date-size: 22px;
          --mr-section-size: 18px;
          --mr-logo-width: 140px;
          --gutter: 20px; /* match template-perspective.html mobile */
        }

        /* Same content side gutters as Perspective — do not keep PDF % insets on narrow */
        .container {
          padding-left: var(--gutter);
          padding-right: var(--gutter);
        }

        .mr-hero {
          aspect-ratio: var(--mr-hero-aspect-mobile, 3 / 2);
          min-height: clamp(200px, 52vw, 280px);
          background-position: var(--mr-hero-position-mobile);
        }

        .mr-hero__inner {
          /* Nới band mobile: keep readable inset; don't use tiny PDF ratio pad */
          padding-top: max(20px, var(--mr-hero-pad-top));
          padding-bottom: 16px;
          min-height: 100%;
        }

        .mr-hero__title {
          max-width: 12ch;
        }

        .mr-table-wrap {
          overflow-x: auto; /* narrow viewports only */
        }

        .mr-table {
          min-width: 640px; /* keep 7 cols readable; scroll inside wrap */
        }

        .mr-footer .perspective-contacts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mr-footer .perspective-contacts__meta {
          grid-column: 1 / -1;
          padding-top: 0;
        }

        /* Protecting-style stacks: flatten second city-pair row when markup matches B.5 */
        .mr-footer
          .perspective-contacts
          > .perspective-contacts__col:nth-child(3) {
          display: contents;
        }
      }
    </style>
  </head>
