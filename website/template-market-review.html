<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title><!-- PAGE_TITLE --></title>
    <meta name="description" content="<!-- META_DESCRIPTION -->" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="<!-- CANONICAL_URL -->" />

    <meta property="og:title" content="<!-- OG_TITLE -->" />
    <meta property="og:description" content="<!-- OG_DESCRIPTION -->" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="<!-- OG_URL -->" />
    <meta property="og:image" content="<!-- OG_IMAGE -->" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<!-- TWITTER_TITLE -->" />
    <meta name="twitter:description" content="<!-- TWITTER_DESCRIPTION -->" />
    <meta name="twitter:image" content="<!-- TWITTER_IMAGE -->" />

    <link
      rel="icon"
      href="https://www.mutualtrust.com.au/wp-content/uploads/2024/10/favicon.png"
      type="image/png"
    />

    <style>
      /* ==========================================================================
       Market Review family template (Group A) — continuous responsive web
       Framework: Mutual-Trust-Design-Analysis-Framework.md (B.7 A + B.5 + B.9 + C.6)

       Patterns vs Perspective (Group C):
       - Hero: title + date OVERLAY on image; typically NO logo on hero (logo in dark footer)
       - Dense body + bullet lists (Flush default; Outdent on some QMR — B.9)
       - Heat data table (--color-positive / --color-negative)
       - Chart grid 2×3 (stack on mobile)
       - Dark footer band: contacts + multi-para disclaimer (not white legal only)

       CONVERT WORKFLOW (C.6):
       1. Inspect PDF (page W→--page-max, hero W/H, table colours, chart panels, footer)
       2. Override :root --page-max / --container-max / --mr-* tokens
       3. Hero inside page shell; overlay title readable (scrim if needed)
       4. Fill continuous article (no page breaks / page numbers / running footer)
       5. Visual Comparison Loop — desktop first, then mobile (hero + 2-col contacts)
       ========================================================================== */

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville.woff2') format('woff2'),
          url('assets/fonts/Baskerville.woff') format('woff'),
          url('assets/fonts/Baskerville.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville-Italic.woff2') format('woff2'),
          url('assets/fonts/Baskerville-Italic.woff') format('woff'),
          url('assets/fonts/Baskerville-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Regular.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Regular.woff') format('woff'),
          url('assets/fonts/ProximaNova-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-RegularIt.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-RegularIt.woff') format('woff'),
          url('assets/fonts/ProximaNova-RegularIt.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Medium.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Medium.woff') format('woff'),
          url('assets/fonts/ProximaNova-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Semibold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Semibold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Bold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Bold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Black.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Black.woff') format('woff'),
          url('assets/fonts/ProximaNova-Black.ttf') format('truetype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        /* Style Guide tokens */
        --font-serif: 'Baskerville', Georgia, 'Times New Roman', serif;
        --font-sans: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;

        --color-black: #000000;
        --color-white: #ffffff;
        --color-light-grey: #f4f4f4;
        --color-grey: #767676;
        --color-ochre: #cb962e;

        --color-ink: var(--color-black);
        --color-ink-muted: var(--color-grey);
        --color-accent: var(--color-ochre);
        --color-link: var(
          --color-ochre
        ); /* override per PDF if intentional (e.g. #D17B19) */
        --color-surface: var(--color-white);
        --color-surface-tint: var(--color-light-grey);
        --color-surface-dark: var(--color-black);

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;
        --space-6: 48px;
        --space-7: 64px;

        /* Page shell = PDF page width @ 96dpi (A4 595.32pt → ~794px). Override per PDF. */
        --page-max: 793.76px;
        /* Content column inside shell (measure PDF text width; typically ~646–760px) */
        --container-max: 760px;
        --gutter: clamp(20px, 5vw, 40px);

        --text-h1: 70px;
        --text-h1-lh: 72px;
        --text-h2: 48px;
        --text-h2-lh: 1.2;
        --text-h3: 40px;
        --text-h3-lh: 1.1;
        --text-h4: 32px;
        --text-h4-lh: 1.3;
        --text-h5: 24px;
        --text-h5-lh: 1.4;
        --text-h6: 16px;
        --text-h6-lh: 1.4;

        --text-large: 20px;
        --text-large-lh: 1.5;
        --text-medium: 18px;
        --text-medium-lh: 24px;
        --text-regular: 16px;
        --text-regular-lh: 1.5;
        --text-small: 14px;
        --text-small-lh: 1.5;

        --focus-ring: 2px solid var(--color-ochre);
        --focus-offset: 3px;

        /* Shared list tokens (framework B.9) */
        --list-marker-color: var(--color-ink);
        --list-marker-gap: 24px;
        --list-indent: var(--list-marker-gap);
        --list-marker-size: 5px;
        --list-item-gap: 0;

        /* Market Review semantic (B.6) — heat table cells */
        --color-positive: #00675a;
        --color-negative: #822333;

        /* ------------------------------------------------------------------
         Market Review tokens — OVERRIDE PER PDF (C.6)
         Example defaults calibrated toward June 2026 QMR; measure each file.
         ------------------------------------------------------------------ */
        --mr-hero-aspect: 595.02 / 149.3; /* PDF band W/H — desktop */
        --mr-hero-aspect-mobile: 3 / 2;
        --mr-hero-position: center center;
        --mr-hero-position-mobile: var(--mr-hero-position);
        --mr-hero-scrim: rgba(0, 0, 0, 0.2); /* override / none if PDF needs no scrim */
        --mr-hero-pad-top: 28px;
        --mr-hero-pad-inline: 0; /* title uses .container gutters */
        --mr-title-size: 52px; /* ~39pt — override per PDF */
        --mr-title-lh: 1.05;
        --mr-title-color: var(--color-white);
        --mr-date-size: 34px; /* ~26pt caps line */
        --mr-date-lh: 1.15;
        --mr-date-tracking: 0.04em;
        --mr-date-color: var(--color-white);
        --mr-band-gap: var(--space-5); /* hero → body */
        --mr-body-size: 14px; /* denser than Perspective; PDF ~10pt */
        --mr-body-lh: 1.35;
        --mr-section-size: 21px; /* ~16pt Baskerville */
        --mr-section-color: var(--color-ink);
        --mr-table-title-color: var(--color-ochre);
        --mr-table-title-size: 16px;
        --mr-table-cell-size: 12px;
        --mr-caption-size: 11px;
        --mr-chart-gap: var(--space-4);
        --mr-footer-bg: var(--color-black);
        --mr-footer-fg: var(--color-white);
        --mr-footer-muted: rgba(255, 255, 255, 0.72);
        --mr-legal-size: 11px;
        --mr-legal-lh: 1.4;
        --mr-contact-label-color: var(--color-white);
        --mr-contact-label-size: 13px;
        --mr-logo-width: 160px;
      }


      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        margin: 0;
        min-width: 0;
        font-family: var(--font-sans);
        font-size: var(--text-regular);
        font-weight: 400;
        line-height: var(--text-regular-lh);
        color: var(--color-ink);
        background-color: var(--color-surface);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      img,
      picture,
      video,
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

    a {
      color: var(--color-link);
      text-decoration: none; /* PDF often colour-only; do not invent underline */
      font-weight: inherit; /* match PDF; do not invent bold links */
    }

    a:hover {
      text-decoration: underline; /* web affordance only */
      text-underline-offset: 0.15em;
    }

      a:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      :focus:not(:focus-visible) {
        outline: none;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        color: var(--color-ink);
      }

      p {
        margin: 0 0 var(--space-3);
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
      }

      strong,
      b {
        font-weight: 700;
      }

      em,
      i {
        font-style: italic;
      }

      .text-muted {
        color: var(--color-ink-muted);
      }

      .text-small {
        font-size: var(--text-small);
        line-height: var(--text-small-lh);
      }

      .skip-link {
        position: absolute;
        left: var(--space-3);
        top: 0;
        z-index: 1000;
        padding: var(--space-2) var(--space-3);
        background: var(--color-black);
        color: var(--color-white);
        font-family: var(--font-sans);
        font-size: var(--text-small);
        text-decoration: none;
        transform: translateY(-120%);
      }

      .skip-link:focus {
        transform: translateY(var(--space-3));
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Continuous document shell = PDF page width (not full viewport, not multi-page A4) */
      .document {
        width: 100%;
        max-width: var(--page-max);
        margin-inline: auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-surface);
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      .site-main {
        flex: 1 0 auto;
        width: 100%;
      }

      /* Never rely on browser default list styling (C.6.6 / B.9) */
      .mr-body ul,
      .mr-body ol {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--space-3);
      }

      /* Shared list — framework B.9 (Flush default; add --outdent / --inset per PDF) */
      ul.mt-list,
      ol.mt-list {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--space-3);
      }

      ul.mt-list > li,
      ol.mt-list > li {
        position: relative;
        padding-left: var(--list-indent);
        text-indent: 0;
        line-height: var(--mr-body-lh);
        margin: 0 0 var(--list-item-gap);
        color: var(--color-ink);
      }

      /* Small disc ≈ SymbolMT — not full-size • (too large vs PDF) */
      ul.mt-list > li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.55em;
        width: var(--list-marker-size);
        height: var(--list-marker-size);
        border-radius: 50%;
        background-color: var(--list-marker-color);
      }

      ol.mt-list {
        counter-reset: mt-counter;
      }

      ol.mt-list > li::before {
        counter-increment: mt-counter;
        content: counter(mt-counter) ".";
        position: absolute;
        left: 0;
        width: var(--list-indent);
        color: var(--list-marker-color);
        font-size: inherit;
        line-height: inherit;
        background: none;
        border-radius: 0;
      }

      .mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }

      .mt-list--inset {
        padding-left: var(--list-indent);
      }

      .mr-body ul.mt-list--inset {
        padding-left: var(--list-indent);
      }

      .mr-body ul.mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }


      /* ==========================================================================
       MARKET REVIEW FAMILY — Group A layout patterns (B.7)
       ========================================================================== */

      /* --- Hero: title overlay, typically no logo (B.7 A) --- */
      .mr-hero {
        position: relative;
        width: 100%;
        aspect-ratio: var(--mr-hero-aspect);
        height: auto;
        min-height: 0;
        overflow: hidden;
        flex-shrink: 0;
        color: var(--color-white);
        background-color: #2a2a2a;
        background-image: var(--mr-hero-image, none);
        background-position: var(--mr-hero-position);
        background-size: cover;
        background-repeat: no-repeat;
      }

      .mr-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--mr-hero-scrim);
        pointer-events: none;
      }

      .mr-hero__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: var(--mr-hero-pad-top);
        padding-bottom: var(--space-4);
        box-sizing: border-box;
      }

      .mr-hero__title {
        margin: 0;
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-title-size);
        line-height: var(--mr-title-lh);
        color: var(--mr-title-color);
        max-width: 18ch;
      }

      .mr-hero__date {
        margin: var(--space-2) 0 0;
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-date-size);
        line-height: var(--mr-date-lh);
        letter-spacing: var(--mr-date-tracking);
        text-transform: uppercase;
        color: var(--mr-date-color);
      }

      /* Optional logo on hero — rare for Group A; hide by default */
      .mr-hero__logo {
        display: none;
        margin-bottom: var(--space-3);
        line-height: 0;
      }

      .mr-hero--with-logo .mr-hero__logo {
        display: inline-block;
      }

      .mr-hero__logo img {
        width: var(--mr-logo-width);
        height: auto;
        display: block;
      }

      /* --- Article --- */
      .mr-article {
        padding-top: var(--mr-band-gap);
        padding-bottom: var(--space-6);
      }

      .mr-body {
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
        color: var(--color-ink);
      }

      .mr-body > p {
        margin: 0 0 var(--space-3);
        font-size: inherit;
        line-height: inherit;
      }

      .mr-body h2,
      .mr-body .mr-section-title {
        margin: var(--space-5) 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--mr-section-size);
        line-height: 1.25;
        color: var(--mr-section-color);
      }

      .mr-body h2:first-child,
      .mr-body .mr-section-title:first-child {
        margin-top: 0;
      }

      .mr-body ul.mt-list {
        margin: 0 0 var(--space-3);
      }

      /* --- Heat / Global Markets table (B.6) --- */
      .mr-table-block {
        margin: var(--space-5) 0;
      }

      .mr-table-block__title {
        margin: 0 0 var(--space-3);
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: var(--mr-table-title-size);
        color: var(--mr-table-title-color);
      }

      .mr-table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .mr-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-sans);
        font-size: var(--mr-table-cell-size);
        line-height: 1.3;
      }

      .mr-table th,
      .mr-table td {
        padding: 6px 8px;
        text-align: right;
        vertical-align: middle;
        border: none;
      }

      .mr-table th:first-child,
      .mr-table td:first-child {
        text-align: left;
        font-weight: 400;
        color: var(--color-ink);
        white-space: nowrap;
      }

      .mr-table thead th {
        font-weight: 400;
        color: var(--color-ink);
        border-bottom: 1px solid var(--color-light-grey);
      }

      .mr-table thead th.mr-table__group {
        color: var(--mr-table-title-color);
        text-align: left;
      }

      .mr-table tbody tr + tr td {
        border-top: 1px solid rgba(0, 0, 0, 0.06);
      }

      /* Heat cells — white text on semantic fill */
      .mr-table .is-positive {
        background: var(--color-positive);
        color: var(--color-white);
        text-align: center;
      }

      .mr-table .is-negative {
        background: var(--color-negative);
        color: var(--color-white);
        text-align: center;
      }

      .mr-table .is-neutral {
        background: var(--color-grey);
        color: var(--color-white);
        text-align: center;
      }

      /* --- Chart grid 2×3 (B.7 A) — split panels; stack on mobile --- */
      .mr-chart-grid {
        margin: var(--space-6) 0 var(--space-5);
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--mr-chart-gap);
      }

      @media (min-width: 700px) {
        .mr-chart-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .mr-chart {
        margin: 0;
      }

      .mr-chart img {
        width: 100%;
        height: auto;
        display: block;
      }

      .mr-chart figcaption,
      .mr-chart .source {
        margin: 6px 0 0;
        font-family: var(--font-sans);
        font-size: var(--mr-caption-size);
        line-height: 1.35;
        color: var(--color-ink-muted);
      }

      /* --- CTA under charts --- */
      .mr-cta {
        margin: var(--space-5) 0 var(--space-6);
        text-align: center;
        font-family: var(--font-sans);
        font-size: var(--mr-body-size);
        line-height: var(--mr-body-lh);
      }

      .mr-cta a {
        color: var(--color-link);
        text-decoration: none;
        font-weight: 700;
      }

      .mr-cta a:hover {
        text-decoration: underline;
      }

      /* --- Contacts grid (B.5) — reused in dark footer --- */
      .perspective-contacts {
        margin: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-3) var(--space-4);
        align-items: start;
      }

      @media (min-width: 600px) {
        .perspective-contacts {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr) minmax(0, 0.85fr) minmax(0, 1.2fr);
          gap: var(--space-3) var(--space-5);
        }

        .perspective-contacts__meta {
          grid-column: auto;
        }
      }

      .perspective-contacts__office,
      .perspective-contacts__stack,
      .perspective-contacts__col {
        margin: 0;
        font-size: inherit;
        line-height: inherit;
      }

      .perspective-contacts__stack + .perspective-contacts__stack {
        margin-top: var(--space-3);
      }

      .perspective-contacts__office strong,
      .perspective-contacts__stack strong {
        display: block;
        margin-bottom: var(--space-1);
      }

      .perspective-contacts__meta {
        margin: 0;
      }

      .perspective-contacts__meta p {
        margin: 0;
      }

      /* --- Dark footer band (B.7 A / B.5 on dark) --- */
      .mr-footer {
        margin-top: auto;
        background: var(--mr-footer-bg);
        color: var(--mr-footer-fg);
        padding: var(--space-6) 0 var(--space-5);
      }

      .mr-footer a {
        color: var(--mr-footer-fg);
        text-decoration: none;
      }

      .mr-footer a:hover {
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .mr-footer__logo {
        display: inline-block;
        margin: 0 0 var(--space-5);
        line-height: 0;
      }

      .mr-footer__logo img {
        width: var(--mr-logo-width);
        height: auto;
        display: block;
      }

      /* Reuse B.5 contact structure; colours for dark band */
      .mr-footer .perspective-contacts {
        margin: 0 0 var(--space-5);
        color: var(--mr-footer-fg);
        font-size: var(--mr-legal-size);
        line-height: var(--mr-legal-lh);
      }

      .mr-footer .perspective-contacts__office strong,
      .mr-footer .perspective-contacts__stack strong {
        color: var(--mr-contact-label-color);
        font-size: var(--mr-contact-label-size);
        font-family: var(--font-sans);
        font-weight: 700;
      }

      .mr-footer .perspective-contacts__meta {
        color: var(--mr-footer-fg);
      }

      .mr-footer .perspective-contacts a {
        color: var(--mr-footer-fg);
        text-decoration: none;
      }

      .mr-footer .mr-legal {
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--mr-legal-size);
        line-height: var(--mr-legal-lh);
        color: var(--mr-footer-muted);
      }

      .mr-footer .mr-legal > p {
        margin: 0 0 var(--space-3);
        font-size: inherit;
        line-height: inherit;
        color: inherit;
      }

      .mr-footer .mr-legal > p:last-child {
        margin-bottom: 0;
      }

      .mr-footer .perspective-contacts + .mr-legal > p:first-child,
      .mr-footer .perspective-contacts + p {
        margin-top: 0;
      }

      /* Mobile / tablet */
      @media (max-width: 768px) {
        :root {
          --mr-title-size: 32px;
          --mr-date-size: 22px;
          --mr-hero-pad-top: 20px;
          --mr-section-size: 18px;
          --mr-logo-width: 140px;
          --gutter: 20px;
        }

        .mr-hero {
          aspect-ratio: var(--mr-hero-aspect-mobile, 3 / 2);
          min-height: clamp(200px, 52vw, 280px);
          background-position: var(--mr-hero-position-mobile);
        }

        .mr-hero__inner {
          padding-bottom: 16px;
          min-height: 100%;
        }

        .mr-hero__title {
          max-width: 14ch;
        }

        .mr-footer .perspective-contacts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .mr-footer .perspective-contacts__meta {
          grid-column: 1 / -1;
          padding-top: 0;
        }

        /* Protecting-style stacks: flatten second city-pair row when markup matches B.5 */
        .mr-footer .perspective-contacts > .perspective-contacts__col:nth-child(3) {
          display: contents;
        }
      }
    </style>
  </head>
