<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title><!-- PAGE_TITLE --></title>
    <meta name="description" content="<!-- META_DESCRIPTION -->" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="<!-- CANONICAL_URL -->" />

    <meta property="og:title" content="<!-- OG_TITLE -->" />
    <meta property="og:description" content="<!-- OG_DESCRIPTION -->" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="<!-- OG_URL -->" />
    <meta property="og:image" content="<!-- OG_IMAGE -->" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<!-- TWITTER_TITLE -->" />
    <meta name="twitter:description" content="<!-- TWITTER_DESCRIPTION -->" />
    <meta name="twitter:image" content="<!-- TWITTER_IMAGE -->" />

    <link
      rel="icon"
      href="https://www.mutualtrust.com.au/wp-content/uploads/2024/10/favicon.png"
      type="image/png"
    />

    <style>
      /* ==========================================================================
       Perspective family template — continuous responsive web (NOT A4 / pagination)
       Framework: Mutual-Trust-Design-Analysis-Framework.md (C.4 + C.6)

       CONVERT WORKFLOW (C.6):
       1. Inspect PDF (assets, logo, hero scrim/overlay, geometry, type, lists, colours)
       2. Override :root --perspective-* / --color-link as needed
       3. Keep hero scrim when PDF needs logo/text contrast (B.4 / C.6.3)
       4. Fill continuous article slots (no page breaks / page numbers)
       5. Visual Comparison Loop vs PDF (desktop first, then responsive)
       Do NOT recreate running headers/footers or PDF page boundaries.
       ========================================================================== */

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville.woff2') format('woff2'),
          url('assets/fonts/Baskerville.woff') format('woff'),
          url('assets/fonts/Baskerville.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Baskerville';
        src:
          url('assets/fonts/Baskerville-Italic.woff2') format('woff2'),
          url('assets/fonts/Baskerville-Italic.woff') format('woff'),
          url('assets/fonts/Baskerville-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Regular.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Regular.woff') format('woff'),
          url('assets/fonts/ProximaNova-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-RegularIt.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-RegularIt.woff') format('woff'),
          url('assets/fonts/ProximaNova-RegularIt.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Medium.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Medium.woff') format('woff'),
          url('assets/fonts/ProximaNova-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Semibold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Semibold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Bold.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Bold.woff') format('woff'),
          url('assets/fonts/ProximaNova-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Proxima Nova';
        src:
          url('assets/fonts/ProximaNova-Black.woff2') format('woff2'),
          url('assets/fonts/ProximaNova-Black.woff') format('woff'),
          url('assets/fonts/ProximaNova-Black.ttf') format('truetype');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        /* Style Guide tokens */
        --font-serif: 'Baskerville', Georgia, 'Times New Roman', serif;
        --font-sans: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;

        --color-black: #000000;
        --color-white: #ffffff;
        --color-light-grey: #f4f4f4;
        --color-grey: #767676;
        --color-ochre: #cb962e;

        --color-ink: var(--color-black);
        --color-ink-muted: var(--color-grey);
        --color-accent: var(--color-ochre);
        --color-link: var(
          --color-ochre
        ); /* override per PDF if intentional (e.g. #D17B19) */
        --color-surface: var(--color-white);
        --color-surface-tint: var(--color-light-grey);
        --color-surface-dark: var(--color-black);

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;
        --space-6: 48px;
        --space-7: 64px;

        /* Content width from PDF measure (~700–760px) — not A4 page width */
        --container-max: 760px;
        --gutter: clamp(20px, 5vw, 40px);

        --text-h1: 70px;
        --text-h1-lh: 72px;
        --text-h2: 48px;
        --text-h2-lh: 1.2;
        --text-h3: 40px;
        --text-h3-lh: 1.1;
        --text-h4: 32px;
        --text-h4-lh: 1.3;
        --text-h5: 24px;
        --text-h5-lh: 1.4;
        --text-h6: 16px;
        --text-h6-lh: 1.4;

        --text-large: 20px;
        --text-large-lh: 1.5;
        --text-medium: 18px;
        --text-medium-lh: 24px;
        --text-regular: 16px;
        --text-regular-lh: 1.5;
        --text-small: 14px;
        --text-small-lh: 1.5;

        --focus-ring: 2px solid var(--color-ochre);
        --focus-offset: 3px;

      /* Shared list tokens (framework B.9) — calibrate indent per PDF Flush/Outdent/Inset */
      --list-marker-color: var(--color-ink);
      --list-marker-gap: 24px; /* = 18pt PDF; fixed px, not em */
      --list-indent: var(--list-marker-gap);
      --list-marker-size: 4px; /* optical disc ≈ SymbolMT on PDF @ body 12pt */
      --list-item-gap: 0; /* override per PDF when source adds gap between items */

        /* ------------------------------------------------------------------
         Perspective family tokens — OVERRIDE PER PDF (C.6.2 / C.6.4 / C.6.5)
         Calibrate: content width → hero → logo → type → spacing → lists
         ------------------------------------------------------------------ */
        --perspective-hero-height: clamp(210px, 32vw, 320px);
        --perspective-hero-position: center center;
        /* Default ≈ measured Perspective PDF flat black @ 25%. Override per file (B.4 / C.6.3). */
        --perspective-hero-scrim: rgba(0, 0, 0, 0.25);
        --perspective-logo-width: 200px;
        --perspective-logo-top: var(--space-5);
        --perspective-title-size: 32px;
        --perspective-title-lh: 1.25;
        --perspective-title-tracking: 0;
        --perspective-title-color: var(
          --color-ochre
        ); /* ink / #4E5E72 one-off via modifier */
        --perspective-byline-size: var(--text-small);
        --perspective-body-size: var(--text-regular);
        --perspective-body-lh: 1.5;
        --perspective-body-tracking: 0;
        --perspective-section-size: var(--text-h5);
        --perspective-section-color: var(--color-ochre);
        --perspective-band-gap: var(
          --space-7
        ); /* hero↔content rhythm — not PDF page gap */
        --perspective-callout-bg: var(--color-surface-tint);
        --perspective-callout-pad: var(--space-4);
        --perspective-promo-bg: var(--color-surface-tint);
        --perspective-legal-size: 12px;
        --perspective-legal-lh: 1.45;
        --perspective-legal-border: 1px solid var(--color-light-grey); /* set none if PDF has no rule */
        --perspective-contact-label-color: #99999b;
        --perspective-contact-label-size: 12px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        margin: 0;
        min-width: 0;
        font-family: var(--font-sans);
        font-size: var(--text-regular);
        font-weight: 400;
        line-height: var(--text-regular-lh);
        color: var(--color-ink);
        background-color: var(--color-surface);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      img,
      picture,
      video,
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

    a {
      color: var(--color-link);
      text-decoration: none; /* PDF often colour-only; do not invent underline */
      font-weight: inherit; /* match PDF; do not invent bold links */
    }

    a:hover {
      text-decoration: underline; /* web affordance only */
      text-underline-offset: 0.15em;
    }

      a:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      :focus:not(:focus-visible) {
        outline: none;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        color: var(--color-ink);
      }

      p {
        margin: 0 0 var(--space-3);
        font-family: var(--font-sans);
        font-size: var(--perspective-body-size);
        line-height: var(--perspective-body-lh);
      }

      strong,
      b {
        font-weight: 700;
      }

      em,
      i {
        font-style: italic;
      }

      .text-muted {
        color: var(--color-ink-muted);
      }

      .text-small {
        font-size: var(--text-small);
        line-height: var(--text-small-lh);
      }

      .skip-link {
        position: absolute;
        left: var(--space-3);
        top: 0;
        z-index: 1000;
        padding: var(--space-2) var(--space-3);
        background: var(--color-black);
        color: var(--color-white);
        font-family: var(--font-sans);
        font-size: var(--text-small);
        text-decoration: none;
        transform: translateY(-120%);
      }

      .skip-link:focus {
        transform: translateY(var(--space-3));
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Continuous document shell — not an A4 / multi-page simulator */
      .document {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      .site-main {
        flex: 1 0 auto;
        width: 100%;
      }

      /* Never rely on browser default list styling (C.6.6 / B.9) */
      .perspective-body ul,
      .perspective-body ol {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--space-3);
      }

      /* Shared list — framework B.9 (Flush default; add --outdent / --inset per PDF) */
      ul.mt-list,
      ol.mt-list {
        list-style: none;
        padding-left: 0;
        margin: 0 0 var(--space-3);
      }

      ul.mt-list > li,
      ol.mt-list > li {
        position: relative;
        padding-left: var(--list-indent);
        text-indent: 0;
        line-height: var(--perspective-body-lh);
        margin: 0 0 var(--list-item-gap);
        color: var(--color-ink);
      }

      /* Small disc ≈ SymbolMT — not full-size • (too large vs PDF) */
      ul.mt-list > li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.55em;
        width: var(--list-marker-size);
        height: var(--list-marker-size);
        border-radius: 50%;
        background-color: var(--list-marker-color);
      }

      ol.mt-list {
        counter-reset: mt-counter;
      }

      ol.mt-list > li::before {
        counter-increment: mt-counter;
        content: counter(mt-counter) ".";
        position: absolute;
        left: 0;
        width: var(--list-indent);
        color: var(--list-marker-color);
        font-size: inherit;
        line-height: inherit;
        background: none;
        border-radius: 0;
      }

      .mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }

      .mt-list--inset {
        padding-left: var(--list-indent);
      }

      .perspective-body ul.mt-list--inset {
        padding-left: var(--list-indent);
      }

      .perspective-body ul.mt-list--outdent {
        margin-left: calc(-1 * var(--list-indent));
      }

      /* ==========================================================================
       PERSPECTIVE FAMILY — Group C layout patterns
       Configurable via :root vars + modifier classes. Not one PDF clone.
       ========================================================================== */

      /* --- Hero: full-bleed image + optional logo (title is NOT on hero) --- */
      .perspective-hero {
        position: relative;
        width: 100%;
        min-height: var(--perspective-hero-height);
        height: var(--perspective-hero-height);
        overflow: hidden;
        color: var(--color-white);
        background-color: #2a2a2a;
        background-image: var(--perspective-hero-image, none);
        background-position: var(--perspective-hero-position);
        background-size: cover;
        background-repeat: no-repeat;
      }

      .perspective-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--perspective-hero-scrim);
        pointer-events: none;
      }

      .perspective-hero__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-top: var(--perspective-logo-top);
        padding-bottom: var(--space-5);
      }

      .perspective-hero__logo {
        display: inline-block;
        line-height: 0;
        width: fit-content;
      }

      .perspective-hero__logo img {
        width: var(--perspective-logo-width);
        height: auto;
        display: block;
      }

      /* Official SVGs are white fill — correct on hero/dark. Invert only if needed on light. */
      .perspective-hero__logo--on-light img {
        filter: brightness(0);
      }

      /* Logo placement modifiers */
      .perspective-hero--logo-top-left .perspective-hero__inner {
        align-items: flex-start;
      }

      .perspective-hero--logo-top-center .perspective-hero__inner {
        align-items: center;
      }

      .perspective-hero--logo-hidden .perspective-hero__logo {
        display: none;
      }

      /* --- Article shell under hero --- */
      .perspective-article {
        padding-top: var(--perspective-band-gap);
        padding-bottom: var(--perspective-band-gap);
      }

      .perspective-article__title {
        margin: 0 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--perspective-title-size);
        line-height: var(--perspective-title-lh);
        letter-spacing: var(--perspective-title-tracking);
        color: var(--perspective-title-color);
      }

      /* Title colour modifiers (PDF variation) */
      .perspective-article--title-ochre {
        --perspective-title-color: var(--color-ochre);
      }

      .perspective-article--title-ink {
        --perspective-title-color: var(--color-ink);
      }

      .perspective-article--title-custom {
        /* Set --perspective-title-color on this node or :root for one-offs */
      }

      /* --- Byline --- */
      .perspective-byline {
        margin: 0 0 var(--space-5);
        font-family: var(--font-sans);
        font-size: var(--perspective-byline-size);
        font-weight: 700;
        line-height: 1.5;
        color: var(--color-ink);
      }

      .perspective-byline.is-empty {
        display: none !important;
      }

      .perspective-byline__meta {
        font-weight: 400;
        color: var(--color-ink-muted);
      }

      /* --- Long-form body --- */
      .perspective-body {
        font-family: var(--font-sans);
        font-size: var(--perspective-body-size);
        line-height: var(--perspective-body-lh);
        letter-spacing: var(--perspective-body-tracking);
        color: var(--color-ink);
      }

      .perspective-body > * + * {
        margin-top: 0;
      }

      .perspective-body h2,
      .perspective-body .perspective-section-title {
        margin: var(--space-6) 0 var(--space-3);
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--perspective-section-size);
        line-height: var(--text-h5-lh);
        color: var(--perspective-section-color);
      }

      /* PDF variant: section heads = Proxima Bold / body size / ink (not Baskerville/Ochre) */
      .perspective-body--sections-sans-bold h2,
      .perspective-body--sections-sans-bold .perspective-section-title {
        font-family: var(--font-sans);
        font-weight: 700;
        line-height: var(--perspective-body-lh);
        color: var(--color-ink);
      }

      .perspective-body h2:first-child,
      .perspective-body .perspective-section-title:first-child {
        margin-top: 0;
      }

      .perspective-body .lede,
      .perspective-body .lede-quote {
        font-family: var(--font-serif);
      }

      .perspective-body .lede-quote--italic,
      .perspective-body .lede-quote--italic em {
        font-style: italic;
      }

      .perspective-body .lede-quote--roman {
        font-style: normal;
      }

      /* --- Callout / quote variants --- */
      .perspective-callout {
        margin: var(--space-5) 0;
        padding: var(--perspective-callout-pad);
        background: var(--perspective-callout-bg);
        color: var(--color-ink);
      }

      .perspective-callout__quote {
        margin: 0;
        font-family: var(--font-serif);
        font-size: var(--text-regular);
        line-height: 1.55;
        font-style: normal; /* PDF roman by default; add --italic if source is italic */
      }

      .perspective-callout__quote--italic {
        font-style: italic;
      }

      .perspective-callout__quote--sans {
        font-family: var(--font-sans);
      }

      .perspective-callout__attribution {
        margin: var(--space-3) 0 0;
        font-family: var(--font-sans);
        font-size: var(--text-small);
        line-height: 1.4;
        color: var(--color-ink);
      }

      .perspective-callout__attribution cite {
        font-style: normal;
        font-weight: 700;
      }

      /* Float / aside callout (desktop) — optional */
      .perspective-callout--aside {
        /* default: full-width block */
      }

      @media (min-width: 700px) {
        .perspective-with-aside {
          position: relative;
        }

        .perspective-with-aside::after {
          content: '';
          display: table;
          clear: both;
        }

        .perspective-callout--aside {
          float: right;
          width: min(200px, 38%);
          margin: 0 0 var(--space-4) var(--space-5);
        }
      }

      /* Untinted plain quote (no panel) */
      .perspective-callout--plain {
        background: transparent;
        padding: 0;
      }

      /* --- Optional promo / podcast / infographic --- */
      .perspective-promo {
        margin: var(--space-6) 0;
        padding: var(--space-4);
        background: var(--perspective-promo-bg);
      }

      .perspective-promo__title {
        margin: 0 0 var(--space-3);
        font-family: var(--font-sans);
        font-size: var(--text-regular);
        font-weight: 700;
        line-height: 1.4;
        color: var(--color-ink);
      }

      .perspective-promo__layout {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      .perspective-promo__media img {
        width: 100%;
        max-width: 220px;
      }

      .perspective-promo__body {
        font-size: var(--text-small);
        line-height: 1.5;
      }

      .perspective-promo__body p:last-child {
        margin-bottom: 0;
      }

      @media (min-width: 600px) {
        .perspective-promo__layout--media-left {
          flex-direction: row;
          align-items: flex-start;
        }

        .perspective-promo__layout--media-left .perspective-promo__media {
          flex: 0 0 auto;
        }

        .perspective-promo__layout--media-left .perspective-promo__body {
          flex: 1 1 auto;
        }
      }

      /* Infographic slot — PDF-specific asset; keep structure only */
      .perspective-infographic {
        margin: var(--space-6) 0;
      }

      .perspective-infographic img,
      .perspective-infographic figure {
        width: 100%;
      }

      .perspective-infographic figcaption,
      .perspective-infographic .source {
        margin-top: var(--space-2);
        font-family: var(--font-sans);
        font-size: var(--text-small);
        line-height: var(--text-small-lh);
        color: var(--color-ink-muted);
      }

      /* Hide optional blocks when unused */
      .is-empty {
        display: none !important;
      }

      /* --- Author sign-off --- */
      .perspective-signoff {
        margin: var(--space-6) 0 0;
        font-family: var(--font-sans);
        font-size: var(--perspective-body-size);
        line-height: 1.55;
        color: var(--color-ink);
      }

      .perspective-signoff__name {
        font-weight: 700;
        margin: 0;
      }

      .perspective-signoff__role,
      .perspective-signoff__org {
        margin: 0;
        font-weight: 400;
      }

      /* --- Inline legal / disclaimer / contacts (white, not dark back cover) --- */
      .perspective-legal {
        margin-top: var(--perspective-band-gap);
        padding-top: var(--space-5);
        border-top: var(--perspective-legal-border);
        font-family: var(--font-sans);
        font-size: var(--perspective-legal-size);
        line-height: var(--perspective-legal-lh);
        color: var(--color-ink);
      }

      .perspective-legal p {
        font-size: inherit;
        line-height: inherit;
        margin: 0 0 var(--space-3);
      }

      .perspective-legal p:last-child {
        margin-bottom: 0;
      }

      .perspective-legal__label {
        font-weight: 700;
        color: var(--color-ink-muted);
        font-size: inherit;
        margin-bottom: var(--space-2);
      }

      .perspective-contacts {
        margin: var(--space-5) 0 0;
        display: grid;
        gap: var(--space-3);
      }

      @media (min-width: 600px) {
        .perspective-contacts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: var(--space-3) var(--space-5);
        }
      }

      @media (min-width: 900px) {
        .perspective-contacts {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .perspective-contacts__office {
        margin: 0;
        font-size: inherit;
        line-height: inherit;
      }

      .perspective-contacts__office strong,
      .perspective-contacts__stack strong {
        display: block;
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: var(--perspective-contact-label-size);
        color: var(--perspective-contact-label-color);
        margin-bottom: var(--space-1);
      }

      .perspective-contacts__meta {
        margin-top: var(--space-4);
        grid-column: 1 / -1;
        font-size: inherit;
        color: var(--color-ink);
      }

      .perspective-contacts a {
        color: var(--color-ink);
        text-decoration: none;
      }

      .perspective-contacts a:hover {
        color: var(--color-link);
        text-decoration: underline; /* web affordance only */
      }

      /* Responsive type floor for Perspective family */
      @media (max-width: 768px) {
        :root {
          --perspective-title-size: 26px;
          --perspective-section-size: 20px;
          --perspective-logo-width: 160px;
          --perspective-band-gap: var(--space-6);
          --gutter: 20px;
          --text-h1: 40px;
          --text-h2: 32px;
          --text-h3: 28px;
          --text-h4: 24px;
          --text-h5: 20px;
        }

        .perspective-hero {
          min-height: 200px;
        }
      }
    </style>
  </head>
  <body class="family-perspective">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!--
    Continuous document flow (framework C.4 / C.6).
    Do NOT add .document-page, page numbers, or repeated running headers/footers.
    PDF page boundaries = visual QA checkpoints only after fill.
  -->
    <div class="document">
      <!--
      HERO — full-bleed; logo once (Group C default: logo-m.svg top-left).
      Modifiers: --logo-top-left | --logo-top-center | --logo-hidden
      Logo URLs (A.5):
        ngang:  https://www.mutualtrust.com.au/wp-content/themes/mutual_trust/assets/images/logo-m.svg
        stacked: https://www.mutualtrust.com.au/wp-content/themes/mutual_trust/assets/images/MT-Logo.svg
      Set hero: style="--perspective-hero-image: url('assets/<slug>/images/hero.jpg')"
      Crop: --perspective-hero-position
    -->
      <header
        class="site-header perspective-hero perspective-hero--logo-top-left"
        role="banner"
        style="--perspective-hero-image: url('<!-- HERO_IMAGE_PATH -->')"
      >
        <div class="container perspective-hero__inner">
          <a
            class="perspective-hero__logo"
            href="https://www.mutualtrust.com.au/"
          >
            <img
              src="https://www.mutualtrust.com.au/wp-content/themes/mutual_trust/assets/images/logo-m.svg"
              alt="Mutual Trust"
              width="200"
              height="23"
            />
          </a>
        </div>
      </header>

      <main id="main-content" class="site-main" role="main" tabindex="-1">
        <!--
        Title: --title-ochre | --title-ink | --title-custom (+ --perspective-title-color)
        Byline: remove .is-empty when PDF has meta under title (once only)
        Body: add .perspective-body--sections-sans-bold when PDF uses Proxima Bold section heads
        Lists: ul.mt-list | .mt-list--inset | .mt-list--outdent (B.9)
      -->
        <article
          class="container perspective-article perspective-article--title-ochre"
        >
          <h1 class="perspective-article__title"><!-- ARTICLE_TITLE --></h1>

          <p class="perspective-byline is-empty">
            <!-- AUTHOR_NAME -->
            <span class="perspective-byline__meta"
              ><!-- AUTHOR_ROLE / DATE --></span
            >
          </p>

          <div class="perspective-body">
            <!-- LONG_FORM_CONTENT: p, h2, ul.mt-list / ul.mt-list--inset, etc. -->

            <aside class="perspective-callout is-empty" aria-label="Callout">
              <blockquote class="perspective-callout__quote">
                <!-- QUOTE_TEXT -->
              </blockquote>
              <p class="perspective-callout__attribution">
                <cite><!-- ATTRIBUTION_NAME --></cite>
                <!-- ATTRIBUTION_ROLE -->
              </p>
            </aside>

            <figure class="perspective-infographic is-empty">
              <img
                src="<!-- INFOGRAPHIC_PATH -->"
                alt="<!-- INFOGRAPHIC_ALT -->"
              />
              <figcaption class="source"><!-- SOURCE_CAPTION --></figcaption>
            </figure>
          </div>

          <footer class="perspective-signoff">
            <p class="perspective-signoff__name"><!-- SIGN_OFF_NAME --></p>
            <p class="perspective-signoff__role"><!-- SIGN_OFF_ROLE --></p>
            <p class="perspective-signoff__org">Mutual Trust</p>
          </footer>

          <aside class="perspective-promo is-empty" aria-label="Related">
            <h2 class="perspective-promo__title"><!-- PROMO_HEADING --></h2>
            <div
              class="perspective-promo__layout perspective-promo__layout--media-left"
            >
              <div class="perspective-promo__media">
                <img
                  src="<!-- PROMO_IMAGE -->"
                  alt="<!-- PROMO_IMAGE_ALT -->"
                />
              </div>
              <div class="perspective-promo__body">
                <!-- PROMO_COPY + link -->
              </div>
            </div>
          </aside>

          <!-- Single legal/contacts block at end — not per-page running footer -->
          <section class="perspective-legal" aria-label="Disclaimer">
            <p><!-- LIABILITY_LINE --></p>
            <p><!-- DISCLAIMER_BODY --></p>
            <p><!-- ACKNOWLEDGEMENT_OF_COUNTRY --></p>

            <div class="perspective-contacts" aria-label="Office contacts">
              <p class="perspective-contacts__office">
                <strong><!-- CITY --></strong>
                <!-- ADDRESS --><br />
                <a href="tel:<!-- TEL_RAW -->"><!-- TEL_DISPLAY --></a>
              </p>
              <p class="perspective-contacts__meta">
                <!-- EMAIL / WEBSITE / ABN / AFSL -->
              </p>
            </div>
          </section>
        </article>
      </main>
    </div>
  </body>
</html>
