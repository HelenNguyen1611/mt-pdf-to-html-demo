<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title><!-- PAGE_TITLE --></title>
  <meta name="description" content="<!-- META_DESCRIPTION -->" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="<!-- CANONICAL_URL -->" />

  <!-- Open Graph -->
  <meta property="og:title" content="<!-- OG_TITLE -->" />
  <meta property="og:description" content="<!-- OG_DESCRIPTION -->" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="<!-- OG_URL -->" />
  <meta property="og:image" content="<!-- OG_IMAGE -->" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="<!-- TWITTER_TITLE -->" />
  <meta name="twitter:description" content="<!-- TWITTER_DESCRIPTION -->" />
  <meta name="twitter:image" content="<!-- TWITTER_IMAGE -->" />

  <link
    rel="icon"
    href="https://www.mutualtrust.com.au/wp-content/uploads/2024/10/favicon.png"
    type="image/png"
  />

  <style>
    /* --------------------------------------------------------------------------
       Local fonts — website/assets/fonts/ (woff2 first)
       Style Guide: Baskerville (headings) + Proxima Nova (body/UI)
       -------------------------------------------------------------------------- */
    @font-face {
      font-family: "Baskerville";
      src:
        url("assets/fonts/Baskerville.woff2") format("woff2"),
        url("assets/fonts/Baskerville.woff") format("woff"),
        url("assets/fonts/Baskerville.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Baskerville";
      src:
        url("assets/fonts/Baskerville-Italic.woff2") format("woff2"),
        url("assets/fonts/Baskerville-Italic.woff") format("woff"),
        url("assets/fonts/Baskerville-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-Regular.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-Regular.woff") format("woff"),
        url("assets/fonts/ProximaNova-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-RegularIt.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-RegularIt.woff") format("woff"),
        url("assets/fonts/ProximaNova-RegularIt.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-Medium.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-Medium.woff") format("woff"),
        url("assets/fonts/ProximaNova-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-Semibold.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-Semibold.woff") format("woff"),
        url("assets/fonts/ProximaNova-Semibold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-Bold.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-Bold.woff") format("woff"),
        url("assets/fonts/ProximaNova-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Proxima Nova";
      src:
        url("assets/fonts/ProximaNova-Black.woff2") format("woff2"),
        url("assets/fonts/ProximaNova-Black.woff") format("woff"),
        url("assets/fonts/ProximaNova-Black.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    /* --------------------------------------------------------------------------
       Design tokens — Mutual Trust Style Guide / framework
       PDF converts may override size / line-height / spacing / placement.
       -------------------------------------------------------------------------- */
    :root {
      /* Typefaces */
      --font-serif: "Baskerville", Georgia, "Times New Roman", serif;
      --font-sans: "Proxima Nova", "Helvetica Neue", Arial, sans-serif;

      /* Colours */
      --color-black: #000000;
      --color-white: #ffffff;
      --color-light-grey: #f4f4f4;
      --color-grey: #767676;
      --color-ochre: #cb962e;

      /* Role aliases */
      --color-ink: var(--color-black);
      --color-ink-muted: var(--color-grey);
      --color-accent: var(--color-ochre);
      --color-surface: var(--color-white);
      --color-surface-tint: var(--color-light-grey);
      --color-surface-dark: var(--color-black);

      /* Spacing scale */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --space-6: 48px;
      --space-7: 64px;

      /* Page shell = PDF page width @ 96dpi (A4 ≈ 794px); content column inside */
      --page-max: 793.76px;
      --container-max: 760px;
      --gutter: clamp(20px, 5vw, 40px);

      /* Typography — Desktop Style Guide baseline */
      --text-h1: 70px;
      --text-h1-lh: 72px;
      --text-h2: 48px;
      --text-h2-lh: 1.2;
      --text-h3: 40px;
      --text-h3-lh: 1.1;
      --text-h4: 32px;
      --text-h4-lh: 1.3;
      --text-h5: 24px;
      --text-h5-lh: 1.4;
      --text-h6: 16px;
      --text-h6-lh: 1.4;

      --text-large: 20px;
      --text-large-lh: 1.5;
      --text-medium: 18px;
      --text-medium-lh: 24px;
      --text-regular: 16px;
      --text-regular-lh: 1.5;
      --text-small: 14px;
      --text-small-lh: 1.5;

      --focus-ring: 2px solid var(--color-ochre);
      --focus-offset: 3px;
    }

    /* --------------------------------------------------------------------------
       Reset / base
       -------------------------------------------------------------------------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      margin: 0;
      min-width: 0;
      font-family: var(--font-sans);
      font-size: var(--text-regular);
      font-weight: 400;
      line-height: var(--text-regular-lh);
      color: var(--color-ink);
      background-color: var(--color-surface);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img,
    picture,
    video,
    svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: var(--color-accent);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible,
    button:focus-visible,
    summary:focus-visible,
    [tabindex]:focus-visible {
      outline: var(--focus-ring);
      outline-offset: var(--focus-offset);
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      margin: 0 0 var(--space-3);
      font-family: var(--font-serif);
      font-weight: 400;
      color: var(--color-ink);
    }

    h1 {
      font-size: var(--text-h1);
      line-height: var(--text-h1-lh);
    }

    h2 {
      font-size: var(--text-h2);
      line-height: var(--text-h2-lh);
    }

    h3 {
      font-size: var(--text-h3);
      line-height: var(--text-h3-lh);
    }

    h4 {
      font-size: var(--text-h4);
      line-height: var(--text-h4-lh);
    }

    h5 {
      font-size: var(--text-h5);
      line-height: var(--text-h5-lh);
    }

    h6 {
      font-size: var(--text-h6);
      line-height: var(--text-h6-lh);
    }

    p {
      margin: 0 0 var(--space-3);
      font-family: var(--font-sans);
      font-size: var(--text-regular);
      line-height: var(--text-regular-lh);
    }

    strong,
    b {
      font-weight: 700;
    }

    em,
    i {
      font-style: italic;
    }

    small,
    .text-small {
      font-size: var(--text-small);
      line-height: var(--text-small-lh);
    }

    .text-large {
      font-size: var(--text-large);
      line-height: var(--text-large-lh);
    }

    .text-medium {
      font-size: var(--text-medium);
      line-height: var(--text-medium-lh);
    }

    .text-muted {
      color: var(--color-ink-muted);
    }

    /* --------------------------------------------------------------------------
       Layout shell (shared — not PDF-specific)
       -------------------------------------------------------------------------- */
    .skip-link {
      position: absolute;
      left: var(--space-3);
      top: 0;
      z-index: 1000;
      padding: var(--space-2) var(--space-3);
      background: var(--color-black);
      color: var(--color-white);
      font-family: var(--font-sans);
      font-size: var(--text-small);
      text-decoration: none;
      transform: translateY(-120%);
    }

    .skip-link:focus {
      transform: translateY(var(--space-3));
      outline: var(--focus-ring);
      outline-offset: var(--focus-offset);
    }

    .page {
      width: 100%;
      max-width: var(--page-max);
      margin-inline: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .site-header,
    .site-main,
    .site-footer {
      width: 100%;
    }

    .site-main {
      flex: 1 0 auto;
    }

    .site-footer {
      margin-top: auto;
    }

    /* Visually hidden (a11y) */
    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* --------------------------------------------------------------------------
       Responsive baseline — scale type on smaller viewports
       PDF pages may further override these values.
       -------------------------------------------------------------------------- */
    @media (max-width: 768px) {
      :root {
        --text-h1: 40px;
        --text-h1-lh: 1.1;
        --text-h2: 32px;
        --text-h2-lh: 1.2;
        --text-h3: 28px;
        --text-h3-lh: 1.15;
        --text-h4: 24px;
        --text-h4-lh: 1.3;
        --text-h5: 20px;
        --text-h5-lh: 1.4;
        --text-h6: 16px;
        --text-h6-lh: 1.4;
        --gutter: 20px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="page">
    <header class="site-header" role="banner">
      <div class="container">
        <!-- Header / hero slot — filled per PDF convert -->
      </div>
    </header>

    <main id="main-content" class="site-main" role="main" tabindex="-1">
      <article class="container">
        <!-- Article content slot — filled per PDF convert -->
      </article>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <!-- Footer / legal slot — filled per PDF convert -->
      </div>
    </footer>
  </div>
</body>
</html>
